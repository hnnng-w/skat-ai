[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "skat-ai"
version = "0.17.0"
description = "Local Skat analysis and simulation tool"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.0.0",
]

[project.scripts]
skat-ai = "skat_ai.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["skat_ai*"]

[tool.setuptools.package-data]
skat_ai = ["py.typed"]
"skat_ai.schema_resources" = ["*.schema.json"]
"skat_ai.capture_web" = ["templates/*.html", "assets/*.css", "assets/*.js"]
"skat_ai.corpus_web" = ["templates/*.html", "assets/*.css", "assets/*.js"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
